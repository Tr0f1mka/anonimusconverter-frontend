<div class="pattern-page">
    <h1>{{ 'patterns' | translate }}</h1>
    <div class="pattern-container" *ngIf="isVericated">
        <div class="pattern-description">
            <p>{{ 'patternPageHelp' | translate }}</p>
            <button (click)="openHelp()" class="help-btn">?</button>
        </div>
        <create-pattern-modal></create-pattern-modal>
    </div>

    <div class="pattern-container">
        <div *ngIf="currentUserId">
            <div class="loading-container" *ngIf="isLoading">
                <div class="spinner-large"></div>
                <p>{{ 'loadingPatterns' | translate }}</p>
            </div>

            <div *ngIf="!isLoading">
                <!-- Шаблоны -->
                <div class="pattern-card-container" *ngIf="patterns.length > 0">

                    <div class="pattern-card" *ngFor="let pattern of patterns">
                        <div class="pattern-loupe">
                            <h2>🔍</h2>
                        </div>
                        <div class="pattern-card-body">
                            <div class="pattern-description">
                                <div class="pattern-meta">
                                    <p>{{ pattern.name }}</p>
                                </div>
                                <div class="pattern-card-preview">
                                    
                                    <show-pattern-modal
                                        [pattern]="pattern">
                                    </show-pattern-modal>
                                </div>
                            </div>
                            <hr class="pattern-card-hr">
                            <div class="pattern-card-btns">
                                <div class="update-pattern-btn">
                                    <update-pattern-modal
                                    [pattern]="pattern">
                                    </update-pattern-modal>
                                </div>
                                <button class="delete-pattern-btn" (click)="deletePattern(pattern)">
                                    {{ 'deletePattern' | translate }}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pattern-footer">
                    <div class="pagination-controls" *ngIf="patterns.length > 0">
                        <button (click)="previousPage()" [disabled]="currentPage === 1" class="page-btn">
                            ← {{ 'back' | translate }}
                        </button>
                        
                        <button *ngFor="let page of getPages()" 
                                (click)="goToPage(page)"
                                [class.active]="page === currentPage"
                                class="page-btn">
                            {{ page }}
                        </button>
                        
                        <button (click)="nextPage()" [disabled]="currentPage === totalPages" class="page-btn">
                            {{ 'forward' | translate }} →
                        </button>
                    </div>
                </div>

                <p *ngIf="patterns.length === 0">{{ 'noPatterns' | translate }}</p>
            </div>
        </div>

        <div *ngIf="!currentUserId || !isVericated">
            <p *ngIf="!currentUserId">{{ 'unAuthPatterns' | translate }}</p>
            <p *ngIf="currentUserId && !isVericated">{{ 'confirmEmailToWorkWithPatterns' | translate }}</p>
        </div>
    </div>
</div>
