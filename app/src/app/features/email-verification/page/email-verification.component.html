<div class="verification-container">
    <div class="verification-card">
        <div class="verification-header">
            <h2>{{ 'emailVerification' | translate }}</h2>
            <p>{{ 'verificationInstruction' | translate }}</p>
        </div>

        <div class="verification-body">
            <div class="email-info">
                <span class="email-label">{{ 'weSentCodeTo' | translate }}</span>
            </div>

            <form [formGroup]="verificationForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label for="code">{{ 'verificationCode' | translate }}</label>
                    <input
                        type="text"
                        id="code"
                        formControlName="code"
                        class="code-input"
                        [class.is-invalid]="verificationForm.get('code')?.invalid && verificationForm.get('code')?.touched"
                        maxlength="6"
                        placeholder="••••••"
                        (input)="onCodeInput($event)"
                        autocomplete="off"
                    >
                    <div class="code-hint">{{ 'codeHint' | translate }}</div>
                    <div class="error-messages" *ngIf="verificationForm.get('code')?.invalid && verificationForm.get('code')?.touched">
                        <div *ngIf="verificationForm.get('code')?.errors?.['required']">
                            {{ 'codeRequired' | translate }}
                        </div>
                        <div *ngIf="verificationForm.get('code')?.errors?.['pattern']">
                            {{ 'codeInvalidFormat' | translate }}
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        (click)="cancelVerification()"
                        [disabled]="isLoading"
                    >
                        <span>{{ 'cancel' | translate }}</span>
                        <!-- <span *ngIf="isDeleting" class="spinner-small"></span> -->
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        [disabled]="verificationForm.invalid || isLoading"
                    >
                        <span *ngIf="!isLoading">{{ 'verify' | translate }}</span>
                        <span *ngIf="isLoading" class="spinner-small"></span>
                    </button>
                </div>
            </form>

            <div class="resend-section">
                <button
                    type="button"
                    class="resend-link"
                    (click)="resendCode()"
                    [disabled]="isResending || resendCooldown > 0"
                >
                    <span *ngIf="!isResending">
                        {{ 'resendCode' | translate }}
                        <span *ngIf="resendCooldown > 0">({{ resendCooldown }}s)</span>
                    </span>
                    <span *ngIf="isResending" class="spinner-small"></span>
                </button>
            </div>
        </div>
    </div>
</div>
