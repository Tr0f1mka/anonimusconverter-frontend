<button class="pattern-card-preview-btn" (click)="openWindow()">
    Открыть
</button>
<div class="show-pattern-modal" *ngIf="isOpen">
    <div class="show-pattern-modal-backdrop" (click)="closeModal()"></div>
    <div class="show-pattern-modal-content">
        <div class="show-pattern-modal-header">
            <h3>Просмотр шаблона</h3>
            <button (click)="closeModal()">×</button>
        </div>
        <div class="show-pattern-modal-body">
            <p><strong>Название:</strong> {{ pattern.name }}</p>

            <div class="table-container">
                <div class="loading-overlay" *ngIf="isLoading">
                    <div class="spinner"></div>
                    <p>Загрузка модификаций...</p>
                </div>

                <table class="modification-table" *ngIf="!isLoading">
                    <thead>
                        <tr>
                            <th class="head">
                                Старое имя
                            </th>
                            <th class="head">
                                Новое имя
                            </th>
                            <th class="head">
                                Новый тип
                            </th>
                            <th class="head">
                                Новое значение
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let modification of currentModifications">
                            <td class="wrap-text">{{ modification.oldName || '—' }}</td>
                            <td class="wrap-text">{{ modification.newName || '—' }}</td>
                            <td>{{ modification.newType || '—' }}</td>
                            <td class="wrap-text">{{ modification.newValue || '—' }}</td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Пагинация -->
                <div class="pagination-container" *ngIf="totalPages > 1 && !isLoading">
                    <div class="pagination-controls">
                        <button (click)="previousPage()" [disabled]="currentPage === 1" class="page-btn">
                            ← Назад
                        </button>
                        
                        <button *ngFor="let page of getPages()" 
                                (click)="goToPage(page)"
                                [class.active]="page === currentPage"
                                class="page-btn">
                            {{ page }}
                        </button>
                        
                        <button (click)="nextPage()" [disabled]="currentPage === totalPages" class="page-btn">
                            Вперед →
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="show-pattern-modal-footer">
            <button (click)="closeModal()" class="close-btn">Закрыть</button>
        </div>
    </div>
</div>
