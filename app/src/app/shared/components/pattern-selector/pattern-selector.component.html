<div class="pattern-selector">
    <!-- Кнопка выбора шаблона -->
    <button 
    class="pattern-btn" 
    [class.pattern-selected]="selectedPattern"
    (click)="openPatternSelector()"
    [disabled]="isLoading">
        <span class="btn-icon">{{ selectedPattern ? '📋' : '📄' }}</span>
        <span class="btn-text">
            {{ selectedPattern ? selectedPattern.name : ('selectPattern' | translate) }}
        </span>
        <span class="btn-icon dropdown-icon" *ngIf="!selectedPattern">▼</span>
        <span class="btn-icon clear-icon" *ngIf="selectedPattern && !isLoading" (click)="clearPattern($event)">✕</span>
        <span class="spinner" *ngIf="isLoading"></span>
    </button>
    
    <!-- Модальное окно выбора шаблона -->
    <div class="modal" *ngIf="showModal" (click)="closeModal()">
        <div class="modal-content" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <h3>Выберите шаблон</h3>
                <button class="close-btn" (click)="closeModal()">×</button>
            </div>
            
            <div class="modal-body">
                <!-- Поиск шаблонов -->
                <!-- <div class="search-box" *ngIf="patterns.length > 0">
                    <input 
                    type="text" 
                    placeholder="Поиск шаблонов..." 
                    [(ngModel)]="searchQuery"
                    (input)="filterPatterns()"
                    class="search-input">
                </div> -->
                
                <!-- Список шаблонов -->
                <div class="patterns-list" *ngIf="filteredPatterns.length > 0; else noPatterns">
                    <div 
                    *ngFor="let pattern of filteredPatterns"
                    class="pattern-item"
                    [class.selected]="selectedPattern?.id === pattern.id"
                    (click)="selectPattern(pattern)">
                        <div class="pattern-info">
                            <div class="pattern-name">{{ pattern.name }}</div>
                        </div>
                        <div class="pattern-actions">
                            <span class="check-icon" *ngIf="selectedPattern?.id === pattern.id">✓</span>
                        </div>
                    </div>
                </div>
                
                <ng-template #noPatterns>
                    <div class="no-patterns">
                        <p>У вас пока нет шаблонов</p>
                        <button class="btn btn-primary" (click)="createPattern()">
                            Создать шаблон
                        </button>
                    </div>
                </ng-template>
            </div>
            
            <div class="modal-footer">
                <div class="footer-info" *ngIf="totalPatterns > 0">
                    Всего шаблонов: {{ totalPatterns }}
                </div>
                <button class="btn btn-secondary" (click)="closeModal()">Отмена</button>
            </div>
        </div>
    </div>
</div>
