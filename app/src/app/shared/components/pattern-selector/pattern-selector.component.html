<div class="pattern-selector">
    <!-- Кнопка выбора шаблона -->
    <button 
    class="pattern-btn" 
    [class.pattern-selected]="selectedPattern"
    (click)="openPatternSelector()">
        <span class="btn-icon">{{ selectedPattern ? '📋' : '📄' }}</span>
        <span class="btn-text">
            {{ selectedPattern ? selectedPattern.name : ('selectPattern' | translate) }}
        </span>
        <span class="btn-icon dropdown-icon" *ngIf="!selectedPattern">▼</span>
        <span class="btn-icon clear-icon" *ngIf="selectedPattern" (click)="clearPattern($event)">✕</span>
    </button>
    
    <!-- Модальное окно выбора шаблона -->
    <div class="modal" *ngIf="showModal" (click)="closeModal()">
        <div class="modal-content" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <h3>{{ 'selectPattern1' | translate }}</h3>
                <button class="close-btn" (click)="closeModal()">×</button>
            </div>
            
            <div class="modal-body">

                <div class="loading-container" *ngIf="isLoading">
                    <div class="spinner-large"></div>
                    <p>{{ 'loadingPatterns' | translate }}</p>
                </div>

                <div *ngIf="!isLoading">
                    <!-- Поиск шаблонов -->
                    <div class="search-box" *ngIf="patterns.length > 0">
                        <input 
                        type="text" 
                        placeholder="{{ 'searchPatterns' | translate }}" 
                        [(ngModel)]="searchQuery"
                        (input)="filterPatterns()"
                        class="search-input">
                    </div>
                    
                    <!-- Список шаблонов -->
                    <div class="patterns-list" *ngIf="filteredPatterns.length > 0; else noPatterns">
                        <div 
                        *ngFor="let pattern of filteredPatterns"
                        class="pattern-item"
                        [class.selected]="selectedPattern?.id === pattern.id"
                        (click)="selectPattern(pattern)">
                            <div class="pattern-info">
                                <div class="pattern-name">{{ pattern.name }}</div>
                            </div>
                            <show-pattern-modal
                                [pattern]="pattern"
                                (isOpenChange)="onShowModalClosed()">
                            </show-pattern-modal>
                        </div>
                    </div>
                    
                    <ng-template #noPatterns>
                        <div class="no-patterns">
                            <p>{{ 'noPatterns' | translate }}</p>
                            <button
                            class="btn btn-primary"
                            (click)="closeModal()"
                            [routerLink]="['/patterns']">
                                {{ 'onPatternsPage' | translate }}
                            </button>
                        </div>
                    </ng-template>
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-secondary" (click)="closeModal()">{{ 'cancel' | translate }}</button>
            </div>
        </div>
    </div>
</div>
