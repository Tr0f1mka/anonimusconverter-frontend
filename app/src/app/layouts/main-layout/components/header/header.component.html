<header class="header">
    <div class="logo" (click)="navigateToHome()">
        <span class="cson">CSON</span>
    </div>
    
    <nav class="nav-menu">
        <a 
            [routerLink]="['/']" 
            routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}"
            class="nav-link">
            {{ 'converter' | translate }}
        </a>
        <a 
            [routerLink]="['/templates']" 
            routerLinkActive="active"
            class="nav-link">
            {{ 'templates' | translate }}
        </a>
        <a 
            [routerLink]="['/auth/login']" 
            routerLinkActive="active"
            class="nav-link">
            {{ 'login' | translate }}
        </a>
    </nav>
    
    <div class="header-actions">
        <app-language-switcher></app-language-switcher>
        <button class="help-btn" (click)="showHelpModal()">?</button>
    </div>
</header>
